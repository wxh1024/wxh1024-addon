plugins {
    id 'fabric-loom' version '1.14.10'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // 国内镜像优先
    maven {
        name = '阿里云 Maven 中央仓库'
        url = 'https://maven.aliyun.com/repository/central'
    }
    maven {
        name = '阿里云 Maven 公共仓库'
        url = 'https://maven.aliyun.com/repository/public'
    }
    maven {
        name = 'Fabric 官方'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Meteor Dev Releases'
        url = 'https://maven.meteordev.org/releases'
    }
    maven {
        name = 'Meteor Dev Snapshots'
        url = 'https://maven.meteordev.org/snapshots'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // 使用本地 meteor-client JAR，编译+运行都需要（具体文件名由各分支的 gradle.properties 指定）
    modApi files("${rootDir}/libs/${project.meteor_jar}")

    // meteor-client 的传递依赖（因使用本地 JAR 需手动声明）
    modApi "meteordevelopment:orbit:0.2.4"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
